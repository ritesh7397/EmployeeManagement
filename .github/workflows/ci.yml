name: .NET Build & Test

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    # Try restoring solution if present
    - name: Restore dependencies (solution)
      run: dotnet restore ./EmployeeManagement/EmployeeManagement.sln

    # Fallback: restore UI project directly
    - name: Restore dependencies (UI project)
      run: dotnet restore ./Employee.UI/Employee.UI.csproj

    - name: Build solution
      run: dotnet build ./EmployeeManagement/EmployeeManagement.sln --no-restore --configuration Release

    - name: Build UI project
      run: dotnet build ./Employee.UI/Employee.UI.csproj --no-restore --configuration Release

    - name: Test solution
      run: dotnet test ./EmployeeManagement/EmployeeManagement.sln --no-build --verbosity normal
