name: .NET Build & Test

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore EmployeeManagement.sln

    - name: Build
      run: dotnet build EmployeeManagement.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test EmployeeManagement.sln --no-build --verbosity normal
